name: Android-App bauen

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK bauen
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: APK als Download bereitstellen (Release "app")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk familienboard.apk
          gh release delete app --yes --cleanup-tag || true
          gh release create app familienboard.apk \
            --title "Familienboard-App (Build ${GITHUB_RUN_NUMBER})" \
            --notes "Auf dem Tablet herunterladen und installieren. Neue Versionen lassen sich einfach über die alte installieren."
